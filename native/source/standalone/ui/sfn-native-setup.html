<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFN Power Setup</title><style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:3rem auto;padding:0 1rem;background:#111;color:#eee}main{border:1px solid #444;border-radius:16px;padding:1.25rem}h1{font-size:1.35rem}label{display:block;margin:.9rem 0 .35rem}input,button{box-sizing:border-box;width:100%;padding:.8rem;border-radius:10px;border:1px solid #555;background:#1d1d1d;color:#fff}button{margin-top:1rem;background:#c4a35a;color:#111;font-weight:700}small,#status{display:block;margin-top:.8rem;color:#bbb}</style><main><h1>SFN Power · Wi‑Fi Setup</h1><small>إعداد شبكة المشترك · 2.4 GHz</small><form id="f"><label for="s">Wi‑Fi / SSID</label><input id="s" name="ssid" maxlength="32" required autocomplete="off"><label for="p">Password / كلمة السر</label><input id="p" name="password" maxlength="64" type="password" autocomplete="current-password"><button>Save & Connect · حفظ واتصال</button></form><div id="status" role="status"></div></main><script>f.onsubmit=async e=>{e.preventDefault();status.textContent='Saving…';try{let r=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f))});status.textContent=r.ok?'Saved. Device is connecting… · تم الحفظ وجارٍ الاتصال':'Failed. Check network/password · راجع الشبكة وكلمة السر'}catch(_){status.textContent='Connection changed. Check your Wi‑Fi list · راجع قائمة الواي فاي'}}</script></html>
